[build]
  command = "cd ../web && npm run build"
  publish = "../web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "cors",
    "dotenv",
    "cheerio",
    "iconv-lite",
    "undici",
    "serverless-http"
  ]

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.jsx"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.ts"
  [headers.values]
    Content-Type = "application/typescript; charset=utf-8"

[[headers]]
  for = "*.tsx"
  [headers.values]
    Content-Type = "application/typescript; charset=utf-8"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
