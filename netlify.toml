[build]
  command = "npm run build"
  publish = "dist"
  # Keep functions out of publish/dist — otherwise Netlify treats public/sw.js
  # (copied into dist/) as a serverless function and the deploy fails.
  functions = "netlify/functions"

[context.production]
  publish = "dist"

[context.deploy-preview]
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
