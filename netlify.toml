# Optional / legacy. Production hosting is Vercel (see vercel.json + vite.config).
[build]
  command = "NITRO_PRESET=netlify npm run build"
  publish = "dist"
  # Keep functions out of publish/dist — otherwise Netlify treats public/sw.js
  # (copied into dist/) as a serverless function and the deploy fails.
  functions = "netlify/functions"

[context.production]
  publish = "dist"

[context.deploy-preview]
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# League scrapes and server functions must never be cached by browsers / CDNs.
[[headers]]
  for = "/_serverFn/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
